# Fast checks on every pull request and on main, on Linux.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Required files
        run: |
          for f in README.md LICENSE CHANGELOG.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md; do
            test -f "$f" || { echo "::error file=$f::$f is missing"; exit 1; }
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Imports resolve
        run: python -c "import pandas, numpy, matplotlib, seaborn, pyAgrum, sklearn, tabulate"

      # The call datasets are confidential and not in the repository, so the notebooks
      # cannot be executed here: check that they are valid and that every code cell compiles.
      - name: Notebooks are valid and compile
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = 0
          for p in sorted(pathlib.Path("src").glob("*.ipynb")):
              try:
                  nb = json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  bad += 1
                  print(f"::error file={p}::invalid JSON: {e}")
                  continue
              for i, c in enumerate(nb["cells"]):
                  if c["cell_type"] != "code":
                      continue
                  src = "".join(c["source"])
                  src = "\n".join(l for l in src.splitlines() if not l.lstrip().startswith(("%", "!")))
                  try:
                      compile(src, f"{p}[cell {i}]", "exec")
                  except SyntaxError as e:
                      bad += 1
                      print(f"::error file={p}::cell {i}: {e}")
          sys.exit(1 if bad else 0)
          PY

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            dir /repo --no-banner --redact
